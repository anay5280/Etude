# XcodeGen spec — generates Etude.xcodeproj (an iOS app) that links the
# EtudeCore Swift package. Run:  xcodegen generate   (brew install xcodegen)
name: Etude
options:
  bundleIdPrefix: com.example.etude
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  EtudeCore:
    path: .

targets:
  Etude:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: EtudeCore
        product: EtudeCore
    info:
      path: App/Info.generated.plist
      properties:
        CFBundleDisplayName: Etude
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Etude listens to the piano you play so it can check your notes and guide your practice."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anay.etude
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
